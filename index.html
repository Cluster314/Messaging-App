<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIRE — Messages</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%231c2731'/%3E%3Cstop offset='100%25' stop-color='%23141c24'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='200' height='200' rx='42' fill='url(%23bg)'/%3E%3Cg fill='%23c79a44' opacity='0.35'%3E%3Ccircle cx='24' cy='24' r='3'/%3E%3Ccircle cx='24' cy='176' r='3'/%3E%3Ccircle cx='176' cy='24' r='3'/%3E%3Ccircle cx='176' cy='176' r='3'/%3E%3C/g%3E%3Cpath d='M42 128 L74 128 L86 96 L100 152 L114 72 L128 128 L158 128' fill='none' stroke='%23c79a44' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='150' cy='58' r='9' fill='%23c79a44'/%3E%3Ccircle cx='150' cy='58' r='16' fill='none' stroke='%23c79a44' stroke-width='2.5' opacity='0.5'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#141c24;
    --ink-2:#1c2731;
    --ink-3:#243140;
    --paper:#efe8d8;
    --paper-2:#e4dcc7;
    --brass:#c79a44;
    --brass-dim:#a17f3a;
    --rust:#a8492e;
    --green:#5c8a5c;
    --line: rgba(239,232,216,0.12);
    --line-dark: rgba(20,28,36,0.12);
    --font-display: 'Courier New', ui-monospace, monospace;
    --font-body: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: var(--ink);
    font-family: var(--font-body);
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
    overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration: 0.001ms !important; transition-duration: 0.001ms !important;}
  }
  button{ font-family: inherit; }

  /* ---------- Toasts ---------- */
  #toastStack{
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    display:flex;
    flex-direction:column;
    gap: 8px;
    max-width: 300px;
  }
  .toast{
    background: var(--ink-2);
    border: 1px solid var(--brass);
    border-radius: 5px;
    padding: 12px 14px;
    animation: slidein 0.25s ease both;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  @keyframes slidein{ from{ opacity:0; transform: translateX(20px);} to{opacity:1; transform:translateX(0);} }
  .toast-title{
    font-family: var(--font-display);
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--brass);
    margin-bottom: 4px;
  }
  .toast-body{ font-size: 13px; color: var(--paper); }

  /* ---------- Auth screen ---------- */
  .auth-screen{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--ink);
    background-image: radial-gradient(circle at 1px 1px, rgba(239,232,216,0.05) 1px, transparent 0);
    background-size: 24px 24px;
    overflow-y:auto;
    padding: 20px;
  }
  .auth-card{
    width: 340px;
    max-width: 90vw;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 30px 28px;
  }
  .auth-brand{
    font-family: var(--font-display);
    letter-spacing: 4px;
    font-size: 15px;
    color: var(--brass);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 4px;
  }
  .auth-brand .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--brass);
    box-shadow: 0 0 8px var(--brass);
  }
  .auth-sub{
    font-family: var(--font-display);
    font-size:10px;
    letter-spacing: 2px;
    color: rgba(239,232,216,0.35);
    margin-bottom: 24px;
  }
  .field{ margin-bottom: 14px; }
  .field label{
    display:block;
    font-family: var(--font-display);
    font-size: 10px;
    letter-spacing: 1.5px;
    color: rgba(239,232,216,0.5);
    margin-bottom: 6px;
  }
  .field input{
    width:100%;
    background: var(--ink);
    border: 1px solid var(--line);
    color: var(--paper);
    padding: 10px 12px;
    font-family: var(--font-body);
    font-size: 14px;
    border-radius: 3px;
    outline: none;
  }
  .field input:focus{ border-color: var(--brass); }
  .field-hint{
    font-size: 11px;
    color: rgba(239,232,216,0.35);
    margin-top: 4px;
  }
  .signup-only{ display:none; }
  .auth-btn{
    width:100%;
    background: var(--brass);
    color: var(--ink);
    border:none;
    font-family: var(--font-display);
    letter-spacing: 1.5px;
    font-size: 11px;
    font-weight:bold;
    padding: 12px 18px;
    border-radius: 4px;
    cursor:pointer;
    margin-top: 6px;
  }
  .auth-btn:hover{ background: #d6ab54; }
  .auth-btn:disabled{ opacity:0.5; cursor:default; }
  .auth-toggle{
    margin-top: 16px;
    text-align:center;
    font-size: 12.5px;
    color: rgba(239,232,216,0.5);
  }
  .auth-toggle a{ color: var(--brass); text-decoration:none; cursor:pointer; }
  .auth-error{
    background: rgba(168,73,46,0.15);
    border: 1px solid var(--rust);
    color: #e8a892;
    font-size: 12.5px;
    padding: 8px 10px;
    border-radius: 4px;
    margin-bottom: 14px;
    display:none;
  }

  /* ---------- App shell ---------- */
  .app{
    display:none;
    grid-template-columns: 320px 1fr;
    height:100vh;
    max-width: 1200px;
    margin: 0 auto;
    background: var(--ink);
    box-shadow: 0 0 60px rgba(0,0,0,0.5);
  }
  .app.visible{ display:grid; }

  .sidebar{
    background: var(--ink);
    border-right: 1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .sidebar-head{
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--line);
  }
  .brand{
    font-family: var(--font-display);
    letter-spacing: 4px;
    font-size: 13px;
    color: var(--brass);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand-left{ display:flex; align-items:center; gap:8px; }
  .brand .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--brass);
    box-shadow: 0 0 8px var(--brass);
  }
  .logout-btn{
    background:none;
    border: 1px solid var(--line);
    color: rgba(239,232,216,0.5);
    font-family: var(--font-display);
    font-size: 9px;
    letter-spacing: 1px;
    padding: 4px 8px;
    border-radius: 3px;
    cursor:pointer;
  }
  .logout-btn:hover{ border-color: var(--brass); color: var(--brass); }
  .brand-sub{
    font-family: var(--font-display);
    font-size:10px;
    letter-spacing: 1px;
    color: rgba(239,232,216,0.35);
    margin-top: 8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .search-wrap{ padding: 12px 16px 4px; position:relative; }
  .search-wrap input{
    width:100%;
    background: var(--ink-2);
    border: 1px solid var(--line);
    color: var(--paper);
    padding: 9px 12px;
    font-family: var(--font-body);
    font-size: 14px;
    border-radius: 3px;
    outline: none;
  }
  .search-wrap input::placeholder{ color: rgba(239,232,216,0.35); }
  .search-wrap input:focus{ border-color: var(--brass); }
  .search-results{
    margin-top: 6px;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow:hidden;
    display:none;
  }
  .search-results.visible{ display:block; }
  .search-result-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 9px 10px;
    background: var(--ink-2);
    border-bottom: 1px solid var(--line);
  }
  .search-result-row:last-child{ border-bottom:none; }
  .sr-info{ flex:1; min-width:0; }
  .sr-name{ font-size:13px; color:var(--paper); }
  .sr-username{ font-family: var(--font-display); font-size:10px; color: rgba(239,232,216,0.4); }
  .sr-action{
    font-family: var(--font-display);
    font-size: 9.5px;
    letter-spacing: 1px;
    padding: 5px 9px;
    border-radius: 3px;
    border: 1px solid var(--brass);
    color: var(--brass);
    background:none;
    cursor:pointer;
    white-space:nowrap;
  }
  .sr-action:hover{ background: var(--brass); color: var(--ink); }
  .sr-action.disabled{
    border-color: var(--line);
    color: rgba(239,232,216,0.3);
    cursor:default;
  }
  .sr-action.disabled:hover{ background:none; color: rgba(239,232,216,0.3); }

  .section-label{
    font-family: var(--font-display);
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(239,232,216,0.4);
    padding: 14px 16px 6px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .badge-count{
    background: var(--rust);
    color: var(--paper);
    font-size: 10px;
    min-width:16px; height:16px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    padding:0 5px;
  }

  .lists{ flex:1; overflow-y:auto; }
  .lists::-webkit-scrollbar{ width:6px; }
  .lists::-webkit-scrollbar-thumb{ background: var(--ink-2); border-radius:3px; }

  .request-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 10px 16px;
  }
  .request-actions{ display:flex; gap:6px; }
  .req-btn{
    font-family: var(--font-display);
    font-size: 9.5px;
    letter-spacing: 1px;
    padding: 5px 8px;
    border-radius: 3px;
    border: none;
    cursor:pointer;
  }
  .req-accept{ background: var(--brass); color: var(--ink); }
  .req-decline{ background: var(--ink-3); color: rgba(239,232,216,0.6); }

  .contact{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 11px 16px;
    cursor:pointer;
    border-left: 3px solid transparent;
  }
  .contact:hover{ background: var(--ink-2); }
  .contact.active{ background: var(--ink-2); border-left-color: var(--brass); }
  .avatar{
    width: 38px; height:38px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--ink);
    background: var(--brass);
    flex-shrink:0;
  }
  .contact-info{ flex:1; min-width:0; }
  .contact-name{ font-size: 14.5px; color: var(--paper); display:flex; align-items:center; gap:6px; }
  .contact-name .uname{ font-family: var(--font-display); font-size: 9.5px; color: rgba(239,232,216,0.35); }
  .contact-preview{
    font-size: 12.5px;
    color: rgba(239,232,216,0.45);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top: 2px;
  }
  .contact-preview.unread{ color: var(--paper); font-weight:bold; }
  .unread-dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--rust);
    flex-shrink:0;
  }
  .empty-note{
    padding: 20px 20px;
    font-family: var(--font-display);
    font-size: 10.5px;
    letter-spacing: 1px;
    color: rgba(239,232,216,0.3);
    line-height:1.8;
  }

  .main{
    display:flex;
    flex-direction:column;
    background: var(--paper);
    color: var(--ink);
    min-width:0;
  }
  .chat-head{
    padding: 16px 26px;
    border-bottom: 1px solid var(--line-dark);
    display:flex;
    align-items:center;
    gap:12px;
    background: var(--paper);
  }
  .back-btn{
    display:none;
    background:none; border:none; cursor:pointer;
    font-family: var(--font-display);
    color: var(--ink);
    font-size: 18px;
    padding: 4px 8px 4px 0;
  }
  .chat-head .avatar{ width:34px; height:34px; font-size:12px; }
  .chat-head-info{ flex:1; }
  .chat-head-info .name{ font-size: 15.5px; font-weight:bold; }
  .chat-head-info .status{
    font-family: var(--font-display);
    font-size: 10.5px;
    letter-spacing:1px;
    color: var(--brass-dim);
    margin-top:2px;
  }
  .remove-friend-btn{
    background:none;
    border: 1px solid var(--line-dark);
    color: rgba(20,28,36,0.4);
    font-family: var(--font-display);
    font-size: 9px;
    letter-spacing: 1px;
    padding: 5px 8px;
    border-radius: 3px;
    cursor:pointer;
  }
  .remove-friend-btn:hover{ border-color: var(--rust); color: var(--rust); }

  .messages{
    flex:1;
    overflow-y:auto;
    padding: 26px 30px;
    display:flex;
    flex-direction:column;
    gap: 4px;
    background-image: radial-gradient(circle at 1px 1px, rgba(20,28,36,0.05) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .messages::-webkit-scrollbar{ width:8px; }
  .messages::-webkit-scrollbar-thumb{ background: var(--paper-2); border-radius:4px; }

  .day-divider{
    text-align:center;
    font-family: var(--font-display);
    font-size: 10.5px;
    letter-spacing: 2px;
    color: var(--brass-dim);
    margin: 18px 0 12px;
  }

  .msg-row{ display:flex; margin: 6px 0; animation: rise 0.28s ease both; }
  @keyframes rise{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform: translateY(0); } }
  .msg-row.out{ justify-content:flex-end; }
  .msg-row.in{ justify-content:flex-start; }

  .bubble{
    max-width: 62%;
    padding: 10px 14px;
    font-size: 14.5px;
    line-height: 1.45;
    position:relative;
    word-wrap: break-word;
  }
  .msg-row.in .bubble{
    background: #fff;
    border: 1px solid var(--line-dark);
    border-radius: 2px 10px 10px 10px;
    color: var(--ink);
  }
  .msg-row.out .bubble{
    background: var(--ink);
    color: var(--paper);
    border-radius: 10px 2px 10px 10px;
  }
  .msg-time{
    font-family: var(--font-display);
    font-size: 9.5px;
    opacity: 0.5;
    margin-top: 4px;
    display:block;
  }

  .composer{
    border-top: 1px solid var(--line-dark);
    padding: 14px 22px;
    display:flex;
    gap: 10px;
    align-items:flex-end;
    background: var(--paper);
  }
  .composer textarea{
    flex:1;
    resize:none;
    border: 1px solid var(--line-dark);
    background: #fff;
    padding: 10px 14px;
    font-family: var(--font-body);
    font-size: 14.5px;
    border-radius: 4px;
    max-height: 120px;
    outline:none;
    color: var(--ink);
  }
  .composer textarea:focus{ border-color: var(--brass); }
  .send-btn{
    background: var(--ink);
    color: var(--brass);
    border:none;
    font-family: var(--font-display);
    letter-spacing: 1.5px;
    font-size: 11px;
    padding: 12px 18px;
    border-radius: 4px;
    cursor:pointer;
  }
  .send-btn:hover{ background: var(--ink-2); }
  .send-btn:disabled{ opacity:0.4; cursor:default; }

  .empty-state{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    color: var(--brass-dim);
    text-align:center;
    padding: 20px;
  }
  .empty-state .glyph{ font-family: var(--font-display); font-size: 34px; letter-spacing: 6px; }
  .empty-state p{ font-family: var(--font-display); font-size: 11px; letter-spacing: 2px; }

  @media (max-width: 760px){
    .app{ grid-template-columns: 1fr; max-width:none; }
    .sidebar{ position: fixed; inset: 0; z-index: 5; transition: transform .25s ease; width:100%; }
    .app.chat-open .sidebar{ transform: translateX(-100%); }
    .back-btn{ display:inline-block; }
  }
</style>
</head>
<body>

<div id="toastStack"></div>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-brand"><span class="dot"></span> WIRE</div>
    <div class="auth-sub">SECURE LINE · SIGN IN TO CONTINUE</div>
    <div class="auth-error" id="authError"></div>
    <form id="authForm">
      <div class="field signup-only" id="displayNameField">
        <label>Display name</label>
        <input type="text" id="displayNameInput" autocomplete="name" maxlength="40">
      </div>
      <div class="field signup-only" id="usernameField">
        <label>Username</label>
        <input type="text" id="usernameInput" autocomplete="off" maxlength="20">
        <div class="field-hint">Lowercase letters, numbers, underscores. 3–20 characters. This is how people find you.</div>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="emailInput" required autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="passwordInput" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="auth-btn" id="authSubmitBtn">LOG IN</button>
    </form>
    <div class="auth-toggle" id="authToggle">
      No account yet? <a id="toggleLink">Sign up</a>
    </div>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <div class="brand-left"><span class="dot"></span> WIRE</div>
        <button class="logout-btn" id="logoutBtn">LOG OUT</button>
      </div>
      <div class="brand-sub" id="userLabel"></div>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Find people by @username…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="lists" id="lists"></div>
  </aside>

  <main class="main" id="mainPanel">
    <div class="empty-state">
      <div class="glyph">✦</div>
      <p>SELECT A LINE TO BEGIN</p>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, deleteDoc, updateDoc, collection, query, orderBy,
  onSnapshot, addDoc, getDocs, where, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDW0lOGAJKnUIWwyn_4KjT0IOUBMT0Ma9Q",
  authDomain: "chat-app-2c45f.firebaseapp.com",
  projectId: "chat-app-2c45f",
  storageBucket: "chat-app-2c45f.firebasestorage.app",
  messagingSenderId: "422879785340",
  appId: "1:422879785340:web:22cf86b0b2b6fb79ea34f9"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

// ---------- DOM refs ----------
const authScreen = document.getElementById('authScreen');
const authForm = document.getElementById('authForm');
const authError = document.getElementById('authError');
const authSubmitBtn = document.getElementById('authSubmitBtn');
const toggleLink = document.getElementById('toggleLink');
const authToggle = document.getElementById('authToggle');
const displayNameField = document.getElementById('displayNameField');
const usernameField = document.getElementById('usernameField');
const displayNameInput = document.getElementById('displayNameInput');
const usernameInput = document.getElementById('usernameInput');
const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');

const appEl = document.getElementById('app');
const listsEl = document.getElementById('lists');
const searchInput = document.getElementById('searchInput');
const searchResultsEl = document.getElementById('searchResults');
const mainPanel = document.getElementById('mainPanel');
const userLabel = document.getElementById('userLabel');
const logoutBtn = document.getElementById('logoutBtn');
const toastStack = document.getElementById('toastStack');

let mode = 'login';
let currentUser = null;
let myProfile = null; // {displayName, username, email}
let activeChatId = null;
let activePeerUid = null;
let unsubMessages = null;
let unsubFriendships = null;
const profileCache = new Map(); // uid -> {displayName, username, email}
const chatUnsubs = new Map(); // chatId -> unsub for last-message listener
const lastOpened = new Map(); // chatId -> timestamp
const unreadCounts = new Map(); // chatId -> count
const lastMessages = new Map(); // chatId -> {text, from, t}
let friendshipsInitial = true;

// ---------- Toasts / notifications ----------
function showToast(title, body){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="toast-title">${escapeHtml(title)}</div><div class="toast-body">${escapeHtml(body)}</div>`;
  toastStack.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

function notify(title, body){
  showToast(title, body);
  if(typeof Notification !== 'undefined' && Notification.permission === 'granted' && document.hidden){
    try{ new Notification(title, { body }); } catch(e){}
  }
}

function requestNotifyPermission(){
  if(typeof Notification !== 'undefined' && Notification.permission === 'default'){
    Notification.requestPermission();
  }
}

// ---------- Auth screen behavior ----------
function wireToggleLink(){
  document.getElementById('toggleLink').addEventListener('click', () => {
    mode = mode === 'login' ? 'signup' : 'login';
    authSubmitBtn.textContent = mode === 'login' ? 'LOG IN' : 'CREATE ACCOUNT';
    displayNameField.style.display = mode === 'signup' ? 'block' : 'none';
    usernameField.style.display = mode === 'signup' ? 'block' : 'none';
    authToggle.innerHTML = mode === 'login'
      ? `No account yet? <a id="toggleLink">Sign up</a>`
      : `Already have an account? <a id="toggleLink">Log in</a>`;
    wireToggleLink();
    authError.style.display = 'none';
  });
}
wireToggleLink();

function showAuthError(msg){
  authError.textContent = msg;
  authError.style.display = 'block';
}

const USERNAME_RE = /^[a-z0-9_]{3,20}$/;

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  authError.style.display = 'none';
  authSubmitBtn.disabled = true;
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  try{
    if(mode === 'login'){
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      const displayName = displayNameInput.value.trim();
      const usernameLower = usernameInput.value.trim().toLowerCase();
      if(!displayName){ throw {code:'custom/no-name'}; }
      if(!USERNAME_RE.test(usernameLower)){ throw {code:'custom/bad-username'}; }
      const takenSnap = await getDoc(doc(db, 'usernames', usernameLower));
      if(takenSnap.exists()){ throw {code:'custom/username-taken'}; }

      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, 'users', cred.user.uid), {
        email: email,
        displayName: displayName,
        username: usernameLower,
        createdAt: Date.now()
      });
      await setDoc(doc(db, 'usernames', usernameLower), { uid: cred.user.uid });
    }
  } catch(err){
    showAuthError(friendlyError(err.code));
  } finally {
    authSubmitBtn.disabled = false;
  }
});

function friendlyError(code){
  const map = {
    'auth/email-already-in-use': 'That email already has an account. Try logging in instead.',
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/weak-password': 'Password should be at least 6 characters.',
    'auth/user-not-found': 'No account found with that email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/too-many-requests': 'Too many attempts. Try again in a moment.',
    'custom/no-name': 'Please enter a display name.',
    'custom/bad-username': 'Usernames must be 3–20 characters: lowercase letters, numbers, underscores only.',
    'custom/username-taken': 'That username is already taken. Try another.'
  };
  return map[code] || 'Something went wrong. Please try again.';
}

logoutBtn.addEventListener('click', () => signOut(auth));

// ---------- Auth state ----------
onAuthStateChanged(auth, async (user) => {
  cleanupSubscriptions();
  if(user){
    currentUser = user;
    let snap = await getDoc(doc(db, 'users', user.uid));
    if(!snap.exists()){
      // shouldn't normally happen, but fallback
      await setDoc(doc(db, 'users', user.uid), { email: user.email, displayName: user.email.split('@')[0], username: '', createdAt: Date.now() });
      snap = await getDoc(doc(db, 'users', user.uid));
    }
    myProfile = snap.data();
    profileCache.set(user.uid, myProfile);

    authScreen.style.display = 'none';
    appEl.classList.add('visible');
    userLabel.textContent = myProfile.username ? '@' + myProfile.username : myProfile.email;

    requestNotifyPermission();
    friendshipsInitial = true;
    subscribeFriendships();
  } else {
    currentUser = null;
    myProfile = null;
    appEl.classList.remove('visible');
    authScreen.style.display = 'flex';
    authForm.reset();
    listsEl.innerHTML = '';
    mainPanel.innerHTML = `<div class="empty-state"><div class="glyph">✦</div><p>SELECT A LINE TO BEGIN</p></div>`;
  }
});

function cleanupSubscriptions(){
  if(unsubMessages) { unsubMessages(); unsubMessages = null; }
  if(unsubFriendships) { unsubFriendships(); unsubFriendships = null; }
  chatUnsubs.forEach(fn => fn());
  chatUnsubs.clear();
  lastOpened.clear();
  unreadCounts.clear();
  lastMessages.clear();
  activeChatId = null;
  activePeerUid = null;
}

// ---------- Helpers ----------
function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s == null ? '' : s;
  return div.innerHTML;
}
function initialsFor(name){
  return (name || '?').slice(0, 2).toUpperCase();
}
function chatIdFor(uidA, uidB){
  return [uidA, uidB].sort().join('_');
}
function friendshipIdFor(uidA, uidB){
  return [uidA, uidB].sort().join('_');
}
function fmtTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], {hour: 'numeric', minute:'2-digit'});
}
function fmtDayLabel(ts){
  const d = new Date(ts);
  const today = new Date();
  const diffDays = Math.floor((new Date(today.getFullYear(),today.getMonth(),today.getDate()) - new Date(d.getFullYear(),d.getMonth(),d.getDate())) / 86400000);
  if(diffDays === 0) return 'TODAY';
  if(diffDays === 1) return 'YESTERDAY';
  return d.toLocaleDateString([], {month:'short', day:'numeric'});
}
async function getProfile(uid){
  if(profileCache.has(uid)) return profileCache.get(uid);
  const snap = await getDoc(doc(db, 'users', uid));
  const data = snap.exists() ? snap.data() : { displayName: 'Unknown', username: '', email:'' };
  profileCache.set(uid, data);
  return data;
}

// ---------- Search by username ----------
let searchDebounce = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  const term = searchInput.value.trim().toLowerCase();
  if(!term){ searchResultsEl.classList.remove('visible'); searchResultsEl.innerHTML=''; return; }
  searchDebounce = setTimeout(() => runSearch(term), 300);
});

async function runSearch(term){
  const usersRef = collection(db, 'users');
  const q = query(usersRef, orderBy('username'), where('username', '>=', term), where('username', '<=', term + '\uf8ff'), limit(8));
  let snap;
  try{
    snap = await getDocs(q);
  } catch(err){
    searchResultsEl.innerHTML = `<div class="search-result-row"><div class="sr-info"><div class="sr-name">Search unavailable right now.</div></div></div>`;
    searchResultsEl.classList.add('visible');
    return;
  }
  const results = [];
  snap.forEach(d => { if(d.id !== currentUser.uid) results.push({ uid: d.id, ...d.data() }); });

  if(results.length === 0){
    searchResultsEl.innerHTML = `<div class="search-result-row"><div class="sr-info"><div class="sr-name">No one found with that username.</div></div></div>`;
    searchResultsEl.classList.add('visible');
    return;
  }

  searchResultsEl.innerHTML = '';
  for(const r of results){
    profileCache.set(r.uid, r);
    const status = friendshipStatusWith(r.uid);
    const row = document.createElement('div');
    row.className = 'search-result-row';
    let actionHtml;
    if(status === 'accepted'){
      actionHtml = `<button class="sr-action disabled">FRIENDS</button>`;
    } else if(status === 'outgoing'){
      actionHtml = `<button class="sr-action disabled">PENDING</button>`;
    } else if(status === 'incoming'){
      actionHtml = `<button class="sr-action" data-accept="${r.uid}">ACCEPT</button>`;
    } else {
      actionHtml = `<button class="sr-action" data-add="${r.uid}">ADD</button>`;
    }
    row.innerHTML = `
      <div class="avatar">${initialsFor(r.displayName)}</div>
      <div class="sr-info">
        <div class="sr-name">${escapeHtml(r.displayName)}</div>
        <div class="sr-username">@${escapeHtml(r.username)}</div>
      </div>
      ${actionHtml}
    `;
    searchResultsEl.appendChild(row);
  }
  searchResultsEl.classList.add('visible');

  searchResultsEl.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => sendFriendRequest(btn.getAttribute('data-add')));
  });
  searchResultsEl.querySelectorAll('[data-accept]').forEach(btn => {
    btn.addEventListener('click', () => respondToRequest(btn.getAttribute('data-accept'), true));
  });
}

document.addEventListener('click', (e) => {
  if(!searchResultsEl.contains(e.target) && e.target !== searchInput){
    searchResultsEl.classList.remove('visible');
  }
});

// ---------- Friendships ----------
let friendshipsData = []; // raw docs
function friendshipStatusWith(uid){
  const fid = friendshipIdFor(currentUser.uid, uid);
  const f = friendshipsData.find(x => x.id === fid);
  if(!f) return 'none';
  if(f.status === 'accepted') return 'accepted';
  if(f.status === 'pending') return f.requestedBy === currentUser.uid ? 'outgoing' : 'incoming';
  return 'none';
}

async function sendFriendRequest(uid){
  const fid = friendshipIdFor(currentUser.uid, uid);
  const ref = doc(db, 'friendships', fid);
  const existing = await getDoc(ref);
  if(existing.exists()) return;
  await setDoc(ref, {
    users: [currentUser.uid, uid],
    requestedBy: currentUser.uid,
    status: 'pending',
    createdAt: Date.now(),
    updatedAt: Date.now()
  });
  searchInput.dispatchEvent(new Event('input'));
}

async function respondToRequest(uid, accept){
  const fid = friendshipIdFor(currentUser.uid, uid);
  const ref = doc(db, 'friendships', fid);
  if(accept){
    await updateDoc(ref, { status: 'accepted', updatedAt: Date.now() });
  } else {
    await deleteDoc(ref);
  }
}

async function removeFriend(uid){
  if(!confirm('Remove this friend? Your message history will remain but the line will close.')) return;
  const fid = friendshipIdFor(currentUser.uid, uid);
  await deleteDoc(doc(db, 'friendships', fid));
}

function subscribeFriendships(){
  const q = query(collection(db, 'friendships'), where('users', 'array-contains', currentUser.uid));
  unsubFriendships = onSnapshot(q, async (snapshot) => {
    const wasInitial = friendshipsInitial;
    const prevIncoming = new Set(
      friendshipsData.filter(f => f.status === 'pending' && f.requestedBy !== currentUser.uid).map(f => f.id)
    );

    friendshipsData = [];
    snapshot.forEach(d => friendshipsData.push({ id: d.id, ...d.data() }));

    // fetch profiles for anyone we don't have cached
    const otherUids = friendshipsData.map(f => f.users.find(u => u !== currentUser.uid));
    await Promise.all(otherUids.map(uid => getProfile(uid)));

    // notify about new incoming requests (skip on initial load)
    if(!wasInitial){
      friendshipsData.forEach(f => {
        if(f.status === 'pending' && f.requestedBy !== currentUser.uid && !prevIncoming.has(f.id)){
          const otherUid = f.users.find(u => u !== currentUser.uid);
          const p = profileCache.get(otherUid);
          notify('New friend request', (p ? p.displayName : 'Someone') + ' wants to connect.');
        }
      });
    }

    // set up / tear down last-message listeners for accepted friends
    const acceptedUids = new Set(
      friendshipsData.filter(f => f.status === 'accepted').map(f => f.users.find(u => u !== currentUser.uid))
    );
    for(const uid of acceptedUids){
      const cid = chatIdFor(currentUser.uid, uid);
      if(!lastOpened.has(cid)) lastOpened.set(cid, Date.now());
      if(!chatUnsubs.has(cid)) subscribeLastMessage(cid, uid);
    }
    for(const [cid, unsub] of chatUnsubs.entries()){
      const uid = cid.replace(currentUser.uid, '').replace('_', '');
      if(!acceptedUids.has(uid)){ unsub(); chatUnsubs.delete(cid); }
    }

    friendshipsInitial = false;
    renderLists();
  });
}

function subscribeLastMessage(chatId, peerUid){
  let isInitial = true;
  const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('t', 'desc'), limit(1));
  const unsub = onSnapshot(q, (snapshot) => {
    if(snapshot.empty){ isInitial = false; return; }
    const m = snapshot.docs[0].data();
    lastMessages.set(chatId, m);

    const isNewIncoming = m.from !== currentUser.uid && m.t > (lastOpened.get(chatId) || 0);
    if(!isInitial && isNewIncoming){
      if(activeChatId === chatId){
        lastOpened.set(chatId, Date.now());
      } else {
        unreadCounts.set(chatId, (unreadCounts.get(chatId) || 0) + 1);
        const p = profileCache.get(peerUid);
        notify(p ? p.displayName : 'New message', m.text);
      }
    }
    isInitial = false;
    renderLists();
  });
  chatUnsubs.set(chatId, unsub);
}

// ---------- Render sidebar lists ----------
function renderLists(){
  const incoming = friendshipsData.filter(f => f.status === 'pending' && f.requestedBy !== currentUser.uid);
  const accepted = friendshipsData.filter(f => f.status === 'accepted');

  let html = '';

  if(incoming.length){
    html += `<div class="section-label">REQUESTS <span class="badge-count">${incoming.length}</span></div>`;
    incoming.forEach(f => {
      const uid = f.users.find(u => u !== currentUser.uid);
      const p = profileCache.get(uid) || {};
      html += `
        <div class="request-row">
          <div class="avatar">${initialsFor(p.displayName)}</div>
          <div class="contact-info">
            <div class="contact-name">${escapeHtml(p.displayName)} <span class="uname">@${escapeHtml(p.username)}</span></div>
          </div>
          <div class="request-actions">
            <button class="req-btn req-accept" data-accept="${uid}">ACCEPT</button>
            <button class="req-btn req-decline" data-decline="${uid}">DECLINE</button>
          </div>
        </div>
      `;
    });
  }

  html += `<div class="section-label">FRIENDS</div>`;
  if(accepted.length === 0){
    html += `<div class="empty-note">NO FRIENDS YET.<br>SEARCH A USERNAME ABOVE<br>TO SEND A REQUEST.</div>`;
  } else {
    accepted.forEach(f => {
      const uid = f.users.find(u => u !== currentUser.uid);
      const p = profileCache.get(uid) || {};
      const cid = chatIdFor(currentUser.uid, uid);
      const last = lastMessages.get(cid);
      const unread = unreadCounts.get(cid) || 0;
      let preview = 'Say hello';
      if(last){
        preview = (last.from === currentUser.uid ? 'You: ' : '') + last.text;
      }
      html += `
        <div class="contact ${activePeerUid === uid ? 'active' : ''}" data-open="${uid}">
          <div class="avatar">${initialsFor(p.displayName)}</div>
          <div class="contact-info">
            <div class="contact-name">${escapeHtml(p.displayName)} <span class="uname">@${escapeHtml(p.username)}</span></div>
            <div class="contact-preview ${unread ? 'unread' : ''}">${escapeHtml(preview)}</div>
          </div>
          ${unread ? '<div class="unread-dot"></div>' : ''}
        </div>
      `;
    });
  }

  listsEl.innerHTML = html;

  listsEl.querySelectorAll('[data-open]').forEach(el => {
    el.addEventListener('click', () => {
      const uid = el.getAttribute('data-open');
      const p = profileCache.get(uid);
      openChat(uid, p);
    });
  });
  listsEl.querySelectorAll('[data-accept]').forEach(el => {
    el.addEventListener('click', () => respondToRequest(el.getAttribute('data-accept'), true));
  });
  listsEl.querySelectorAll('[data-decline]').forEach(el => {
    el.addEventListener('click', () => respondToRequest(el.getAttribute('data-decline'), false));
  });
}

// ---------- Chat ----------
function openChat(peerUid, peerProfile){
  activePeerUid = peerUid;
  activeChatId = chatIdFor(currentUser.uid, peerUid);
  lastOpened.set(activeChatId, Date.now());
  unreadCounts.set(activeChatId, 0);
  renderLists();
  renderChatShell(peerUid, peerProfile || profileCache.get(peerUid) || {});
  appEl.classList.add('chat-open');

  if(unsubMessages) unsubMessages();
  const msgsRef = collection(db, 'chats', activeChatId, 'messages');
  const q = query(msgsRef, orderBy('t', 'asc'));
  unsubMessages = onSnapshot(q, (snapshot) => {
    const msgs = [];
    snapshot.forEach(d => msgs.push(d.data()));
    renderMessages(msgs);
    lastOpened.set(activeChatId, Date.now());
    unreadCounts.set(activeChatId, 0);
  });
}

function renderChatShell(peerUid, peer){
  mainPanel.innerHTML = `
    <div class="chat-head">
      <button class="back-btn" id="backBtn" aria-label="Back to contacts">←</button>
      <div class="avatar">${initialsFor(peer.displayName)}</div>
      <div class="chat-head-info">
        <div class="name">${escapeHtml(peer.displayName)}</div>
        <div class="status">@${escapeHtml(peer.username)}</div>
      </div>
      <button class="remove-friend-btn" id="removeFriendBtn">REMOVE</button>
    </div>
    <div class="messages" id="messagesEl"></div>
    <div class="composer">
      <textarea id="composerInput" placeholder="Write a message…" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" disabled>SEND</button>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => appEl.classList.remove('chat-open'));
  document.getElementById('removeFriendBtn').addEventListener('click', () => removeFriend(peerUid));

  const input = document.getElementById('composerInput');
  const sendBtn = document.getElementById('sendBtn');

  input.addEventListener('input', () => {
    sendBtn.disabled = input.value.trim().length === 0;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      trySend();
    }
  });
  sendBtn.addEventListener('click', trySend);

  async function trySend(){
    const text = input.value.trim();
    if(!text || !activeChatId) return;
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    try{
      await addDoc(collection(db, 'chats', activeChatId, 'messages'), {
        from: currentUser.uid,
        text: text,
        t: Date.now()
      });
    } catch(err){
      alert('Message failed to send: ' + err.message);
    }
  }
}

function renderMessages(msgs){
  const wrap = document.getElementById('messagesEl');
  if(!wrap) return;
  wrap.innerHTML = '';
  let lastDay = null;
  msgs.forEach(m => {
    const dayLabel = fmtDayLabel(m.t);
    if(dayLabel !== lastDay){
      const div = document.createElement('div');
      div.className = 'day-divider';
      div.textContent = dayLabel;
      wrap.appendChild(div);
      lastDay = dayLabel;
    }
    const mine = m.from === currentUser.uid;
    const row = document.createElement('div');
    row.className = 'msg-row ' + (mine ? 'out' : 'in');
    row.innerHTML = `
      <div class="bubble">
        ${escapeHtml(m.text)}
        <span class="msg-time">${fmtTime(m.t)}</span>
      </div>
    `;
    wrap.appendChild(row);
  });
  wrap.scrollTop = wrap.scrollHeight;
}
</script>
